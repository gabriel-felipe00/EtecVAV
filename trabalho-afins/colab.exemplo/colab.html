<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vendas sorvete</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        background:linear-gradient(135deg,#00c6ff,#0072ff);
    }

    .container{
        background:white;
        padding:30px;
        border-radius:15px;
        width:400px;
        text-align:center;
        box-shadow:0 10px 25px rgba(207, 50, 50, 0.781);
    }

    h1{
        color:#0072ff;
        margin-bottom:20px;
    }

    p{
        margin-bottom:15px;
        color:#000000;
    }

    input{
        width:100%;
        padding:12px;
        border:2px solid #ddd;
        border-radius:8px;
        font-size:16px;
        margin-bottom:15px;
    }

    button{
        width:100%;
        padding:12px;
        border:none;
        border-radius:8px;
        background:#90dfff;
        color:rgb(0, 0, 0);
        font-size:16px;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#e95c57;
    }

    .resultado{
        margin-top:20px;
        padding:15px;
        background:#f4f4f4;
        border-radius:8px;
        font-size:18px;
        font-weight:bold;
        color:#333;
    }
</style>
</head>

<body>

<div class="container">
    <h1>🍦 Previsão de Vendas</h1>

    <p>Digite a temperatura (°C)</p>

    <input type="number" id="temperatura" placeholder="Ex: 30">

    <button onclick="prever()">Calcular Previsão</button>

    <div class="resultado" id="resultado">
        A previsão aparecerá aqui
    </div>
</div>

<script>
function prever() {

    const temp = parseFloat(document.getElementById("temperatura").value);

    if(isNaN(temp)){
        alert("Digite uma temperatura válida!");
        return;
    }

    /*
      Baseado no modelo treinado:
      Temperatura -> Vendas
      20°C = 200
      22°C = 220
      24°C = 240
      26°C = 260
      28°C = 280

      Equação encontrada:
      vendas = 10 * temperatura
    */

    const vendas = temp * 10;

    document.getElementById("resultado").innerHTML =
        `🍦 Vendas previstas para ${temp}°C: <br><br>
         <strong>${vendas.toFixed(2)} sorvetes</strong>`;
}
</script>

</body>
</html>
